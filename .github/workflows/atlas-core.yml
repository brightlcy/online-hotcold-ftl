name: ATLAS C++ core
on:
  push:
    branches: ['atlas-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            sanitizers: 'OFF'
          - compiler: clang
            cc: clang
            cxx: clang++
            sanitizers: 'ON'
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DATLAS_SANITIZERS=${{ matrix.sanitizers }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python reproduce.py verify
      - if: matrix.compiler == 'clang'
        run: |
          python -m pip install clang-format==20.1.8
          find include src tests/cpp tests/differential -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
          for source in src/nand/nand.cpp src/ftl/page_mapping.cpp src/gc/greedy.cpp; do
            clang++ --analyze -std=c++20 -Iinclude "$source"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-test-logs-${{ matrix.compiler }}
          path: build/Testing/Temporary/
