   <text style="fill: #4b5e70; font: 9.5px 'DejaVu Sans'" transform="translate(105.868203 331.074078)">Source: one-pass profiles of four 100k-request trace slices. dev740 is 100% writes, but only 14.4% are repeat writes.</text>
